name: firefox_vpn
description: "Ralysnd Ember — Mozilla, V2Ray and Psiphon in one client (a cross-platform shell for the Go VPN core)"
publish_to: 'none'

version: 2.2.0+2038

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  intl: any
  # Ember 2: QR display for sharing configs, camera scanning for import.
  qr_flutter: 4.1.0
  mobile_scanner: 7.1.3
  # Password-protected expiring share links (Android build 2030): AES-256-GCM.
  pointycastle: 3.9.1
  # Browser sign-in on Windows (Kumiho contract): WebView2 host —
  # webview_flutter has no Windows implementation.
  flutter_inappwebview: 6.1.5

# Packages published less than two weeks ago are held back until they have
# been out longer.
dependency_overrides:
  vector_graphics_compiler: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb (l10n.yaml).
  generate: true

  assets:
    # The fox shield beside the app's name (tool/app_icons.py).
    - assets/logo.png
    - assets/tray/
    # Country flags from flag-icons (MIT, assets/flags/LICENSE), the same
    # SVG files as the core's web dashboard.
    - assets/flags/
    # The Xray core's geo data (assets/geo; from the AndroidLibXrayLite
    # assets, themselves the v2fly geo files), for the routing presets.
    - assets/geo/
    # The Psiphon core's embedded server entries (from the official
    # app's published resources; see PsiphonConstants.kt).
    - assets/psiphon/
    # Open-source license texts (the AGPL-3.0 full text for the
    # EmberWarp core, Android build 2030; extended for the Windows
    # engine sidecars).
    - assets/licenses/
    # The baked Map Control backdrop (tool/bake_backdrop.py renders
    # world_map_data.dart's raster at 3600x1800 with the samples'
    # detail stack; the live pins/arc keep the painter projection).
    - assets/backdrop/

  fonts:
    # Vazirmatn (SIL Open Font License 1.1, assets/fonts/OFL.txt) for Persian.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
