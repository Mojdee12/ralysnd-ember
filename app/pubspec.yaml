name: firefox_vpn
description: "Cross-platform shell for the Go VPN core"
publish_to: 'none'

version: 2.2.0+2156

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  intl: any
  # Ember 2: QR display for sharing configs, camera scanning for import.
  qr_flutter: 4.1.0
  mobile_scanner: 7.1.3
  # Password-protected expiring share links (build 2030): AES-256-GCM.
  pointycastle: 3.9.1
  webview_flutter: ^4.14.1
  # Clash YAML subscription import (build 2075): the real YAML
  # parser — resolved from the offline pub cache, no download.
  yaml: 3.1.3

# Packages published less than two weeks ago are held back until they have
# been out longer.
dependency_overrides:
  vector_graphics_compiler: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb (l10n.yaml).
  generate: true

  assets:
    # The fox shield beside the app's name (tool/app_icons.py).
    - assets/logo.png
    - assets/tray/
    # The baked Map Control backdrop (tool/bake_backdrop_mobile.py).
    - assets/backdrop/
    # Country flags from flag-icons (MIT, assets/flags/LICENSE), the same
    # SVG files as the core's web dashboard.
    - assets/flags/
    # The Xray core's geo data (assets/geo; from the AndroidLibXrayLite
    # assets, themselves the v2fly geo files), for the routing presets.
    - assets/geo/
    # Open-source license texts (the AGPL-3.0 full text for the
    # EmberWarp core, build 2030).
    - assets/licenses/
    # The Psiphon embedded server entries — the bootstrap floor
    # the service extracts and the sidecar imports at start
    # (build 2090; removed in 2089, restored byte-exact from
    # pkg2088 — see lib/psiphon/psiphon_sidecar_config.dart).
    - assets/psiphon/
    # The offline IP→country tables (build 2129, leg 6):
    # v2fly/geoip-derived range tables, CC BY-SA 4.0 — see
    # assets/licenses/geoip-notice.txt and lib/net/geo_country.dart.
    # ~15.5 MB for both families.
    - assets/geoip/

  fonts:
    # Vazirmatn (SIL Open Font License 1.1, assets/fonts/OFL.txt) for Persian.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
