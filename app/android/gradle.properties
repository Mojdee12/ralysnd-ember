# Ember 2: capped for this 8 GB build VM — the template's 8G heap got
# the daemon killed once the dependency graph grew (mobile_scanner).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Build 2104: AGP 9.1's recommended compileSdk ceiling is
# 36; the WG Tunnel backend AARs require 37 (see
# app/build.gradle.kts). Acknowledge the deliberate step
# past the recommendation.
android.suppressUnsupportedCompileSdk=37
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
