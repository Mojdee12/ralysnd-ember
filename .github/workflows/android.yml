# Ralysnd Ember for Android: builds the release APK on a GitHub
# runner with the same recipe as the local build-2146-private.sh +
# package-2146.sh pair (Flutter 3.47.7, JDK 21, committed
# -Xmx4G gradle.properties, strip to arm64-v8a, zipalign, re-sign
# with the toolchain debug keystore, v1 signing disabled).
#
# Manual runs ("Run workflow"). This workflow NEVER creates a
# GitHub release: it uploads the packaged APK as a workflow
# artifact; publishing stays with the local release ritual.
#
# Secrets:
#   EMBER_KEYSTORE_B64            base64 of toolchain/ember-debug.keystore
#   EMBER_REGIONHOP_DEFAULTS_B64  base64 of the real
#                                 app/lib/regionhop/regionhop_defaults.dart
#                                 (the repo carries a placeholder at
#                                 that path; CI writes the real file
#                                 into place before building)
name: ember-android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional label for this build (run name only; CI does not publish)"
        required: false
        default: ""
      app_version:
        description: "APP_VERSION dart-define"
        required: false
        default: "2.2.0"
      app_build:
        description: "APP_BUILD dart-define"
        required: false
        default: "2146"

run-name: ember-android ${{ inputs.release_tag || inputs.app_build }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7 # the same pin as .github/workflows/windows.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The real RegionHop defaults replace the tracked
      # placeholder before anything compiles.
      - name: Restore real RegionHop defaults
        env:
          REGIONHOP_DEFAULTS_B64: ${{ secrets.EMBER_REGIONHOP_DEFAULTS_B64 }}
        run: |
          if [ -z "$REGIONHOP_DEFAULTS_B64" ]; then
            echo "EMBER_REGIONHOP_DEFAULTS_B64 secret is missing" >&2
            exit 1
          fi
          echo "$REGIONHOP_DEFAULTS_B64" | base64 -d > app/lib/regionhop/regionhop_defaults.dart

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.EMBER_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "EMBER_KEYSTORE_B64 secret is missing" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ember.keystore"

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: >-
          flutter build apk --release
          --dart-define=APP_VERSION=${{ inputs.app_version }}
          --dart-define=APP_BUILD=${{ inputs.app_build }}

      # package-2146.sh, verbatim in effect: strip the fat APK to
      # arm64-v8a, zipalign -p 4, apksigner with the toolchain
      # keystore (alias androiddebugkey, v1 signing disabled).
      - name: Package (strip ABIs, zipalign, sign)
        run: |
          set -eu
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p pkg
          cp app/build/app/outputs/flutter-apk/app-release.apk pkg/strip.apk
          zip -d pkg/strip.apk "lib/armeabi-v7a/*" "lib/x86_64/*" "lib/x86/*" || true
          "$BT/zipalign" -p 4 pkg/strip.apk pkg/aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/ember.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled false \
            --out pkg/RalysndEmber2.apk \
            pkg/aligned.apk
          "$BT/apksigner" verify --print-certs pkg/RalysndEmber2.apk
          sha256sum pkg/RalysndEmber2.apk

      - uses: actions/upload-artifact@v7
        with:
          name: RalysndEmber2-apk
          path: pkg/RalysndEmber2.apk
          if-no-files-found: error
